<!doctype html>
<!--
  The Blog page, at blog/ beside the demo (tools/blog.py writes it to
  blog/index.html, its asset paths one level up, with the posts from
  blog/*.md in the list, newest first). The posts are written in
  Markdown; blog/README.md says how.
  Its look is the Audits page's (web/audits.html), copied from it; keep
  the pages alike. Each label a person reads is on one line of its own,
  for tools/lint-page.sh.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e4e7ea">
<title>Blog: notes on Faraday</title>
<meta name="description" content="News and notes about Faraday, the offline key appliance.">
<link rel="canonical" href="https://faradayoffline.app/blog/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://faradayoffline.app/blog/">
<meta property="og:site_name" content="Faraday">
<meta property="og:title" content="Faraday blog">
<meta property="og:description" content="News and notes about Faraday, the offline key appliance.">
<meta property="og:image" content="https://faradayoffline.app/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/atom+xml" title="Faraday blog" href="https://faradayoffline.app/blog/feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-23 -10 146 146'%3E%3Cpath fill='%230062a3' fill-rule='evenodd' d='M0 12A12 12 0 0 1 12 0H88A12 12 0 0 1 100 12V81.2Q98 115 50 135.3Q2 115 0 81.2ZM45.5 52.2A15 15 0 1 1 54.5 52.2L65 82.5H35Z'/%3E%3C/svg%3E">
<style>
  /* The app's palette in Cobalt, as the download page's. */
  :root {
    --surface: #ffffff;
    --line: #d9e1f0;
    --inner: #e6ecf7;
    --border: #c3cfe3;
    --text: #131b27;
    --muted: #4d5b6e;
    --dim: #788699;
    --accent: #0062a3;
    --on-accent: #ffffff;
    --ok: #1d8556;
    --warn: #9a5d00;
    --bad: #b3261e;
    --page: #e4e7ea;
    --page-3: #f6f7f8;
    --page-line: rgb(20 30 40 / 0.12);
    --ink-hi: #18212a;
    --ink-mid: #4f5c67;
    --shadow: 25 35 45;
    --accent-hi: color-mix(in oklab, var(--accent), black 8%);
    --rim: color-mix(in oklab, var(--accent), white 50%);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", "Noto Sans Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink-hi);
    background: var(--page);
    font: 15px/1.55 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 3px; border-radius: 6px; }
  button { font: inherit; }
  code { font: 0.92em/1.4 var(--mono); overflow-wrap: anywhere; }

  /* The bar, as the download page's. */
  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in oklab, var(--page) 90%, transparent);
    backdrop-filter: saturate(1.3) blur(14px);
    -webkit-backdrop-filter: saturate(1.3) blur(14px);
    border-bottom: 1px solid var(--page-line);
  }
  .bar-in { max-width: 1920px; margin: 0 auto; padding: 6px 16px; display: flex; align-items: center; gap: 10px; min-height: 50px; }
  .brand {
    --cap: 13px;
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    column-gap: calc(var(--cap) * 0.75);
    row-gap: calc(var(--cap) * 0.22);
    width: max-content;
    color: var(--ink-hi);
  }
  .brand:hover { text-decoration: none; }
  .mark { grid-row: 1 / span 2; grid-column: 1; align-self: center; display: block; width: calc(var(--cap) * 1.6); height: auto; }
  .name { grid-row: 1; grid-column: 2; display: block; fill: currentColor; height: var(--cap); width: calc(var(--cap) * 6067 / 687); }
  .under { grid-row: 2; grid-column: 2; display: block; fill: var(--ink-mid); overflow: visible; height: calc(var(--cap) * 426 / 687); width: calc(var(--cap) * 6067 / 687); }
  .bar nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .bar nav a.plain { color: var(--ink-mid); padding: 6px 12px; border-radius: 999px; transition: color 200ms, background-color 200ms; }
  .bar nav a.plain:hover { color: var(--ink-hi); background: var(--page-3); text-decoration: none; }
  .bar nav a.plain[aria-current] { color: var(--ink-hi); background: var(--page-3); }

  /* Buttons. */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 36px;
    padding: 0 14px;
    font: 500 14px/1 var(--font);
    color: var(--ink-hi);
    background: var(--page-3);
    border: 1px solid var(--page-line);
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 200ms, border-color 200ms, color 200ms, transform 150ms;
    user-select: none;
    -webkit-user-select: none;
    white-space: nowrap;
  }
  .btn:hover { text-decoration: none; background: color-mix(in oklab, var(--page-3), var(--accent) 22%); border-color: color-mix(in oklab, var(--page-line), var(--accent-hi) 50%); }
  .btn:active { transform: scale(0.96); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.accent { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .btn.accent:hover { background: color-mix(in oklab, var(--accent), white 10%); }
  .btn.coffee svg { width: 17px; height: 17px; }

  /* The page: a heading, then sections, each a heading and cards. */
  main { max-width: 1100px; margin: 0 auto; padding: 48px 16px 24px; }
  .top { text-align: center; margin-bottom: 8px; }
  .top h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.02em; line-height: 1.15; }
  .top p { max-width: 640px; margin: 0 auto; color: var(--ink-mid); }
  .jump { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0 0; }
  section { padding: 48px 0 8px; }
  section + section { border-top: 1px solid var(--page-line); margin-top: 40px; }
  section > h2 { margin: 0 0 6px; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -0.015em; text-align: center; }
  section > .sub { max-width: 680px; margin: 0 auto 24px; color: var(--ink-mid); text-align: center; }
  .card { padding: 20px 22px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .card > p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .card > p:last-child { margin-bottom: 0; }
  .aside { max-width: 680px; margin: 16px auto 0; color: var(--ink-mid); font-size: 14px; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* The blog: the list's cards, and a post's column. */
  .post + .post { margin-top: 16px; }
  .post h3 { margin: 0 0 4px; font-size: 19px; }
  .post .meta { margin: 0 0 8px; color: var(--muted); font-size: 13.5px; }
  .post > p:last-child { color: var(--text); font-size: 14.5px; }
  .none { margin: 0 auto; max-width: 680px; padding: 28px 22px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 18px; }
  #posts { max-width: 760px; margin: 0 auto; padding-top: 32px; }
  .article { max-width: 68ch; margin: 0 auto; padding: 8px 0 0; font-size: 17px; line-height: 1.65; }
  .back { display: inline-block; margin-bottom: 20px; font-size: 14px; }
  .article h1 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.02em; line-height: 1.15; }
  .article .meta { margin: 0 0 28px; color: var(--ink-mid); font-size: 14px; }
  .article h2 { margin: 36px 0 8px; font-size: 24px; letter-spacing: -0.01em; line-height: 1.25; }
  .article h3 { margin: 28px 0 6px; font-size: 19px; line-height: 1.3; }
  .article h4 { margin: 22px 0 4px; font-size: 16px; }
  .article p, .article ul, .article ol, .article blockquote, .article pre { margin: 0 0 16px; }
  .article ul, .article ol { padding-left: 1.4em; }
  .article li { margin: 0 0 4px; }
  .article blockquote { padding: 2px 0 2px 16px; color: var(--ink-mid); border-left: 3px solid var(--rim); }
  .article blockquote > :last-child { margin-bottom: 0; }
  .article pre { padding: 14px 16px; overflow-x: auto; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .article pre code { overflow-wrap: normal; }
  .article :not(pre) > code { padding: 1px 5px; background: var(--inner); border-radius: 5px; }
  .article img { display: block; max-width: 100%; height: auto; margin: 0 0 16px; border-radius: 10px; }

  /* Buy me a coffee: a dialog with the two QR codes. */
  .link { padding: 0; font: inherit; color: var(--ink-hi); background: none; border: 0; cursor: pointer; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .close { position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 34px; height: 34px; color: var(--muted); background: none; border: 0; border-radius: 50%; cursor: pointer; }
  .close:hover { color: var(--text); background: var(--inner); }
  .close svg { width: 18px; height: 18px; }
  .coffee-box { width: min(calc(100% - 32px), 520px); padding: 24px 24px 20px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 30px 70px -30px rgb(var(--shadow) / 0.5); }
  .coffee-box::backdrop { background: rgb(var(--shadow) / 0.35); backdrop-filter: blur(3px); }
  .coffee-box h2 { margin: 0 34px 4px 0; font-size: 20px; }
  .coffee-box > p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .qrs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .qrs figure { margin: 0; text-align: center; }
  .qr { display: grid; place-items: center; aspect-ratio: 1; padding: 8px; color: var(--dim); font-size: 13px; background: #fff; border: 1px dashed var(--border); border-radius: 12px; }
  .qrs figcaption { margin-top: 6px; font-weight: 600; font-size: 14px; }

  footer { margin-top: 48px; border-top: 1px solid var(--page-line); color: var(--ink-mid); font-size: 13px; }
  footer div { max-width: 1440px; margin: 0 auto; padding: 20px 16px 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px 20px; }
  footer div > :first-child { justify-self: start; }
  footer div > :last-child { justify-self: end; }
  @media (max-width: 640px) { footer div { grid-template-columns: 1fr; justify-items: center; } footer div > :first-child, footer div > :last-child { justify-self: center; } }
  footer a { color: var(--ink-hi); }

  @media (max-width: 1100px) { .bar .coffee span { display: none; } .bar .coffee { padding: 0 10px; } }
  @media (max-width: 640px) {
    main { padding-top: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* The bar's menu: on a narrow screen, where the bar's links and Buy me
     a coffee have no room, a list of them under a button. */
  .menu { position: relative; display: none; }
  .menu-btn { padding: 0 10px; }
  .menu-btn svg { width: 18px; height: 18px; }
  .menu-list {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 60;
    min-width: 210px;
    margin: 0;
    padding: 6px;
    list-style: none;
    background: var(--page);
    border: 1px solid var(--page-line);
    border-radius: 14px;
    box-shadow: 0 18px 40px -18px rgb(var(--shadow) / 0.45);
  }
  .menu-list[hidden] { display: none; }
  .menu-list a, .menu-list button {
    display: block;
    width: 100%;
    padding: 11px 12px;
    font: 500 15px/1.2 var(--font);
    color: var(--ink-hi);
    text-align: left;
    background: none;
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  .menu-list a:hover, .menu-list button:hover, .menu-list :focus-visible { background: var(--page-3); text-decoration: none; }
  .menu-list a[aria-current] { background: var(--page-3); }
  /* The menu replaces the bar's links from 720px: with Audits and Blog
     among them they no longer fit in a row below that. */
  @media (max-width: 720px) {
    .bar nav a.plain, .bar nav a.gh { display: none; }
    .bar .menu { display: block; }
    .bar nav > .coffee { display: none; }
  }
</style>
</head>

<!-- Donations: the QR codes go in the two frames (data-qr), as on the
     demo page. -->
<dialog class="coffee-box" id="coffee" aria-labelledby="coffee-title">
  <button class="close" id="coffee-close" aria-label="Close" title="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <h2 id="coffee-title">Buy me a coffee</h2>
  <p>Donations to Faraday's development, in bitcoin.</p>
  <div class="qrs">
    <figure><div class="qr" data-qr="lightning">QR code to come</div><figcaption>Lightning</figcaption></figure>
    <figure><div class="qr" data-qr="bitcoin">QR code to come</div><figcaption>Bitcoin</figcaption></figure>
  </div>
</dialog>

<footer>
  <div>
    <span>Faraday · MIT License</span>
    <button class="link" data-coffee>Buy me a coffee</button>
    <a href="https://github.com/bitcoinpasada/faraday">github.com/bitcoinpasada/faraday</a>
  </div>
</footer>

<script>
"use strict";
// Buy me a coffee, as on the download page.
const coffee = document.querySelector("#coffee");
for (const b of document.querySelectorAll("[data-coffee]")) b.addEventListener("click", () => coffee.showModal());
document.querySelector("#coffee-close").addEventListener("click", () => coffee.close());
coffee.addEventListener("click", (e) => { if (e.target === coffee) coffee.close(); });

// The bar's menu, on a narrow screen: the button opens the list and
// Escape, a choice, a tap outside or the focus leaving close it.
{
  const button = document.querySelector("#menu-btn");
  const list = document.querySelector("#menu");
  const wrap = button.parentElement;
  const items = () => [...list.querySelectorAll("a, button")];
  const show = (on, back) => {
    list.hidden = !on;
    button.setAttribute("aria-expanded", String(on));
    if (on) items()[0].focus();
    else if (back) button.focus();
  };
  button.addEventListener("click", () => show(list.hidden, false));
  list.addEventListener("click", (e) => {
    const item = e.target.closest("a, button");
    if (!item) return;
    show(false, false);
    // Buy me a coffee: the focus comes back to the menu's button.
    if (item.hasAttribute("data-coffee")) coffee.addEventListener("close", () => button.focus(), { once: true });
  });
  list.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const all = items();
    const i = all.indexOf(document.activeElement);
    all[(i + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || list.hidden) return;
    e.preventDefault();
    e.stopPropagation();
    show(false, true);
  }, true);
  document.addEventListener("pointerdown", (e) => {
    if (!list.hidden && !wrap.contains(e.target)) show(false, false);
  });
  wrap.addEventListener("focusout", (e) => {
    if (!list.hidden && e.relatedTarget && !wrap.contains(e.relatedTarget)) show(false, false);
  });
}
</script>
</body>
</html>
